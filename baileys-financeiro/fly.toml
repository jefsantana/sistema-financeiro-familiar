# fly.toml app configuration file generated for sistema-financeiro-baileys on 2026-09-11T19:49:36-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sistema-financeiro-baileys'
primary_region = 'gru'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[mounts]
  source = "baileys_auth"
  destination = "/app/auth_info_baileys"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
