    <ul class="sidebar__menu">
      <li><a href="#dashboard" class="sidebar__link" data-page="dashboard">📊 Dashboard</a></li>
      <li><a href="#entradas" class="sidebar__link" data-page="entradas">💵 Entradas</a></li>
      <li><a href="#gastos" class="sidebar__link" data-page="gastos">🧾 Gastos</a></li>

      <li><a href="#configuracoes" class="sidebar__link" data-page="configuracoes">⚙️ Configurações</a></li>

    <!-- ÁREA ONDE AS TELAS VÃO APARECER -->
    <main class="content" id="content" aria-live="polite">
      <p>Carregando...</p>
    </main>

  <!-- ===================== -->
  <!-- ARQUIVOS JAVASCRIPT    -->
  <!-- ===================== -->
  <script type="module" src="js/main.js"></script>
